name: Java CI

# Trigger workflow on push or pull_request
# Note - the first pull_request from a forked repo will need to be given approval to run
on:
  push:
  pull_request:
  workflow_dispatch: # Adds a "Run workflow" button in GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Required by SonarCloud for accurate blame & new code detection

    - name: Set up JDK 8
      uses: actions/setup-java@v6
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build Test and Verify
      run: mvn -B -U clean install

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    # Generate SBOM (default is bom.json, bom.xml)
    - name: Generate SBOM
      run: mvn org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
    # Upload SBOMs
    - name: Upload SBOMs as GitHub Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.event.repository.name }}-sbom-${{ github.run_number }}
        path: |
          target/bom.json
          target/bom.xml
        overwrite: true
        retention-days: 7

    # Scan Project for vulnernabilities (Scanning the SBOM with trivy  does not play nice with sonarcloud)
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0 # NOSONAR
      with:
        scan-type: 'fs'
        scan-ref: '.'
        scanners: 'vuln'
        format: 'sarif'
        output: 'trivy-results.sarif'
    # Upload sarif
    - name: Upload Trivy sarif
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.event.repository.name }}-trivy-sarif-${{ github.run_number }}
        path: trivy-results.sarif
        overwrite: true
        retention-days: 7

    # Sonar Scan
    - name: SonarCloud Scan
      run: |
        if ["$SONAR_TOKEN" == ""]; then
          echo "Sonar secure variables NOT available"
        else
          echo "Sonar secure variables ARE available"
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey="bordertech-java-config" \
            -Dsonar.organization="bordertech-github" \
            -Dsonar.host.url="https://sonarcloud.io" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.sarifReportPaths="trivy-results.sarif"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
